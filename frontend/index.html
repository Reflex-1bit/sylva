<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sylva — Agroforestry Intelligence</title>
<style>
  :root {
    --bg: #05100c;
    --bg-panel: rgba(9, 26, 20, 0.72);
    --line: rgba(84, 226, 168, 0.22);
    --glow: #54e2a8;
    --glow-dim: #2f8f68;
    --text: #d6f3e6;
    --text-dim: #6f9d8a;
    --amber: #e8c56a;
    --clay: #d98a5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 800px at 78% 42%, rgba(47,143,104,0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
  }

  .app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; }

  /* ── Left panel ─────────────────────────────────────────── */
  .panel {
    border-right: 1px solid var(--line);
    background: var(--bg-panel);
    backdrop-filter: blur(6px);
    padding: 38px 34px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: 2px;
    color: var(--text);
  }
  .brand .leaf { color: var(--glow); font-size: 26px; filter: drop-shadow(0 0 8px var(--glow)); }
  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: -14px;
  }

  .search label {
    display: block;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .search-row { display: flex; gap: 8px; }
  .search input {
    flex: 1;
    background: rgba(3, 12, 9, 0.8);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 13px 14px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus {
    border-color: var(--glow-dim);
    box-shadow: 0 0 0 1px var(--glow-dim), 0 0 18px rgba(84,226,168,0.15);
  }
  .search input::placeholder { color: var(--text-dim); }
  .search button {
    background: var(--glow);
    color: #04150e;
    border: none;
    padding: 0 18px;
    font-family: inherit;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  .search button:hover { box-shadow: 0 0 18px rgba(84,226,168,0.5); }
  .search button:disabled { opacity: .45; cursor: wait; }

  .coords {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    min-height: 16px;
  }
  .coords b { color: var(--amber); }

  /* ── Results ────────────────────────────────────────────── */
  .results { display: flex; flex-direction: column; gap: 18px; }
  .status { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }
  .status.err { color: var(--clay); }

  .card {
    border: 1px solid var(--line);
    background: rgba(4, 16, 11, 0.55);
    padding: 18px;
  }
  .card h3 {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--glow-dim);
    margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .metric { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid rgba(84,226,168,0.06); }
  .metric:last-child { border-bottom: none; }
  .metric .k { color: var(--text-dim); }
  .metric .v { color: var(--text); }

  .health-bar { height: 6px; background: rgba(255,255,255,0.06); margin-top: 8px; overflow: hidden; }
  .health-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--clay), var(--amber), var(--glow)); }

  .species-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .species-list li { font-size: 12.5px; display: flex; justify-content: space-between; color: var(--text); }
  .species-list .sci { font-style: italic; color: var(--text); }
  .species-list .n { color: var(--text-dim); }

  .fade-in { animation: fadeIn .5s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── Globe ──────────────────────────────────────────────── */
  .stage { position: relative; }
  #globe { width: 100%; height: 100%; display: block; }
  .stage-label {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-dim);
    pointer-events: none;
  }
  .scanline {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(84,226,168,0.03) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr 320px; }
    .panel { border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT: brand + search + results -->
  <aside class="panel">
    <div>
      <div class="brand"><span class="leaf">✦</span><h1>Sylva</h1></div>
      <div class="tagline">Agroforestry Intelligence</div>
    </div>

    <div class="search">
      <label for="loc">Search a location</label>
      <div class="search-row">
        <input id="loc" type="text" placeholder="e.g. Córdoba, Spain" autocomplete="off" />
        <button id="go">SCAN</button>
      </div>
      <div class="coords" id="coords"></div>
    </div>

    <div class="results" id="results">
      <div class="status">Enter a location to profile the land.</div>
    </div>
  </aside>

  <!-- RIGHT: hologram globe -->
  <main class="stage">
    <canvas id="globe"></canvas>
    <div class="scanline"></div>
    <div class="stage-label" id="stageLabel">Awaiting coordinates</div>
  </main>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── CONFIG ──────────────────────────────────────────────────
// Point this at your FastAPI backend.
const API_BASE = 'http://localhost:8000/api/v1';

// ── Globe setup ─────────────────────────────────────────────
const canvas = document.getElementById('globe');
const stage = canvas.parentElement;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 0, 3.1);

const R = 1;
const globe = new THREE.Group();
scene.add(globe);

// Wireframe sphere (the hologram shell)
const wire = new THREE.Mesh(
  new THREE.SphereGeometry(R, 40, 30),
  new THREE.MeshBasicMaterial({ color: 0x54e2a8, wireframe: true, transparent: true, opacity: 0.16 })
);
globe.add(wire);

// Inner solid-ish glow sphere
const inner = new THREE.Mesh(
  new THREE.SphereGeometry(R * 0.985, 48, 36),
  new THREE.MeshBasicMaterial({ color: 0x08251a, transparent: true, opacity: 0.55 })
);
globe.add(inner);

// Latitude/longitude bright rings
const ringMat = new THREE.LineBasicMaterial({ color: 0x54e2a8, transparent: true, opacity: 0.35 });
for (let i = 1; i < 6; i++) {
  const lat = (i / 6) * Math.PI - Math.PI / 2;
  const r = Math.cos(lat) * R, y = Math.sin(lat) * R;
  const pts = [];
  for (let a = 0; a <= 64; a++) { const t = (a / 64) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(t) * r, y, Math.sin(t) * r)); }
  globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ringMat));
}

// Glow halo
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.15, 48, 36),
  new THREE.MeshBasicMaterial({ color: 0x2f8f68, transparent: true, opacity: 0.08, side: THREE.BackSide })
);
globe.add(halo);

// Location marker (hidden until search)
const markerGroup = new THREE.Group();
markerGroup.visible = false;
globe.add(markerGroup);
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.022, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xe8c56a })
);
markerGroup.add(marker);
const pulse = new THREE.Mesh(
  new THREE.RingGeometry(0.03, 0.05, 24),
  new THREE.MeshBasicMaterial({ color: 0xe8c56a, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
);
markerGroup.add(pulse);

function latLonToVec3(lat, lon, radius = R) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

function placeMarker(lat, lon) {
  const pos = latLonToVec3(lat, lon, R * 1.01);
  markerGroup.position.copy(pos);
  markerGroup.lookAt(0, 0, 0);
  markerGroup.visible = true;
}

// Spin globe so target lat/lon faces the camera
let targetRotY = 0, targetRotX = 0;
let autoSpin = true;
function faceLocation(lat, lon) {
  targetRotY = -(lon + 180) * Math.PI / 180 - Math.PI / 2;
  targetRotX = lat * Math.PI / 180;
  autoSpin = false;
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;
  if (autoSpin) globe.rotation.y += 0.0016;
  else {
    globe.rotation.y += (targetRotY - globe.rotation.y) * 0.05;
    globe.rotation.x += (targetRotX - globe.rotation.x) * 0.05;
  }
  const s = 1 + Math.sin(t * 2.5) * 0.25;
  pulse.scale.set(s, s, s);
  pulse.material.opacity = 0.6 - (s - 0.75) * 0.4;
  renderer.render(scene, camera);
}
animate();

// ── Geocoding (OpenStreetMap Nominatim — free, no key) ──────
async function geocode(query) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  const data = await res.json();
  if (!data.length) throw new Error('Location not found');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name };
}

// ── UI wiring ───────────────────────────────────────────────
const input = document.getElementById('loc');
const goBtn = document.getElementById('go');
const coordsEl = document.getElementById('coords');
const resultsEl = document.getElementById('results');
const stageLabel = document.getElementById('stageLabel');

function setStatus(msg, isErr = false) {
  resultsEl.innerHTML = `<div class="status ${isErr ? 'err' : ''}">${msg}</div>`;
}

async function scan() {
  const q = input.value.trim();
  if (!q) return;
  goBtn.disabled = true;
  setStatus('Locating…');
  coordsEl.textContent = '';
  try {
    const { lat, lon, name } = await geocode(q);
    coordsEl.innerHTML = `<b>${lat.toFixed(4)}</b>, <b>${lon.toFixed(4)}</b>`;
    stageLabel.textContent = name.split(',').slice(0, 2).join(',');
    placeMarker(lat, lon);
    faceLocation(lat, lon);

    setStatus('Profiling the land… (soil · vegetation · species)');
    const res = await fetch(`${API_BASE}/farm/profile?lat=${lat}&lon=${lon}&radius_km=5`);
    if (!res.ok) throw new Error(`Backend error ${res.status}`);
    const profile = await res.json();
    renderProfile(profile);
  } catch (e) {
    setStatus(`${e.message}. Is the backend running on :8000?`, true);
  } finally {
    goBtn.disabled = false;
  }
}

function metric(k, v) { return `<div class="metric"><span class="k">${k}</span><span class="v">${v ?? '—'}</span></div>`; }

function renderProfile(p) {
  const soil = p.soil?.topsoil;
  const ndvi = p.ndvi;
  const species = (p.observed_species || []).slice(0, 8);
  let html = '';

  if (soil) {
    html += `<div class="card fade-in"><h3>Soil</h3>
      ${metric('pH', soil.ph)}
      ${metric('Texture', soil.texture_class)}
      ${metric('Organic carbon', soil.organic_carbon_g_kg ? soil.organic_carbon_g_kg + ' g/kg' : null)}
      ${metric('Nitrogen', soil.nitrogen_g_kg ? soil.nitrogen_g_kg + ' g/kg' : null)}
      ${metric('Clay / Sand / Silt', soil.clay_pct ? `${soil.clay_pct} / ${soil.sand_pct} / ${soil.silt_pct}%` : null)}
    </div>`;
  }

  if (ndvi) {
    const pct = Math.round((ndvi.health_score ?? 0) * 100);
    html += `<div class="card fade-in"><h3>Vegetation Health</h3>
      ${metric('NDVI (mean)', ndvi.mean_ndvi)}
      ${metric('Status', ndvi.health_label)}
      <div class="health-bar"><span style="width:${pct}%"></span></div>
    </div>`;
  }

  if (species.length) {
    html += `<div class="card fade-in"><h3>Observed species <span class="n">${p.observed_species.length} total</span></h3>
      <ul class="species-list">${species.map(s =>
        `<li><span class="sci">${s.name}</span><span class="n">${s.occurrences}</span></li>`).join('')}</ul>
    </div>`;
  }

  if (p.warnings?.length || Object.keys(p.errors || {}).length) {
    const notes = [...(p.warnings || []), ...Object.entries(p.errors || {}).map(([k, v]) => `${k}: ${v}`)];
    html += `<div class="card fade-in"><h3>Notes</h3><div class="status">${notes.join('<br>')}</div></div>`;
  }

  resultsEl.innerHTML = html || '<div class="status err">No data returned.</div>';
}

goBtn.addEventListener('click', scan);
input.addEventListener('keydown', e => { if (e.key === 'Enter') scan(); });
</script>
</body>
</html>
